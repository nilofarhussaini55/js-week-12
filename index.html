<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List - Edit Tasks</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #245c45;
        }

        .description {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 10px;
            background-color: #eaf5ef;
            border-radius: 6px;
        }

        li {
            transition: background-color 0.3s ease;
        }

        li:hover {
            background-color: #d5eadc;
        }
        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
        }

        button {
            padding: 7px 12px;
            border: none;
            border-radius: 5px;
            background-color: #2f7d5b;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #245c45;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 7px;
            border: 1px solid #2f7d5b;
            border-radius: 5px;
            font-size: 15px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>My Task List</h1>
        <p class="description">Manage your daily tasks easily</p>

        <ul id="taskList">
            <li data-task-id="1">
                <span class="task-text">Learn HTML</span>
            </li>

            <li data-task-id="2">
                <span class="task-text">Practice CSS</span>
            </li>

            <li data-task-id="3">
                <span class="task-text">Learn JavaScript</span>
            </li>

            <li data-task-id="4">
                <span class="task-text">Practice GitHub</span>
            </li>
        </ul>
    </div>

    <script src="script.js"></script>

</body>

</html>
